# Render's free plan sleeps after 15 minutes without traffic and takes about a
# minute to wake. A store owner opening the demo link shouldn't wait, so ping it.
# Needs the repository variable DEMO_URL (e.g. https://volta-demo.onrender.com).
name: Keep demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ vars.DEMO_URL != '' }}
    steps:
      - run: curl --fail --silent --show-error --max-time 120 --output /dev/null "${{ vars.DEMO_URL }}"
