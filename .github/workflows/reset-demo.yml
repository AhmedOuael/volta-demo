# Empties the demo store every night (orders, customers) and restores stock.
# Needs the repository secret DATABASE_URL (the demo database, direct connection).
name: Reset demo store

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC = 04:00 in Algeria
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:reset-demo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
